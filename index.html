<script>
/* ===================== AUDIO (Web Audio, fully synthesised, no files) ===================== */
const AUDIO=(()=>{
  let ctx,master,ambF,rainG,wb,vol=.5,depth=0,lastD=-1,wx='sunny';
  const level=()=>vol*vol;
  const noise=(type)=>{const n=ctx.sampleRate*3,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);let l=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;if(type==='brown'){l=(l+.02*w)/1.02;d[i]=l*3.5}else d[i]=w}return b};
  const loop=buf=>{const s=ctx.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s};
  function blip(){
    if(!ctx||ctx.state!=='running'||vol<=0)return;
    const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=260+Math.random()*520;
    o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*2.2,t+.09);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+.16);
  }
  const sched=()=>{blip();setTimeout(sched,500+Math.random()*2200)};
  function setDepth(d,force){
    depth=d;if(!ctx||(!force&&Math.abs(d-lastD)<.01))return;
    lastD=d;ambF.frequency.setTargetAtTime(750-520*d,ctx.currentTime,.3);
  }
  function setWeather(n){wx=n;if(rainG)rainG.gain.setTargetAtTime(n==='rain'?.1:0,ctx.currentTime,1.5)}
  function setVolume(v){vol=v;if(master)master.gain.setTargetAtTime(level(),ctx.currentTime,.05)}
  function start(){
    if(ctx){ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    try{ctx=new AC()}catch(e){ctx=null;return}
    master=ctx.createGain();master.gain.value=level();master.connect(ctx.destination);
    const br=noise('brown');wb=noise('white');
    ambF=ctx.createBiquadFilter();ambF.type='lowpass';ambF.frequency.value=700;ambF.Q.value=.7;
    const ag=ctx.createGain();ag.gain.value=.5;
    loop(br).connect(ambF);ambF.connect(ag);ag.connect(master);
    const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.08;lg.gain.value=160;lfo.connect(lg);lg.connect(ambF.frequency);lfo.start();
    const rf=ctx.createBiquadFilter();rf.type='highpass';rf.frequency.value=2500;rainG=ctx.createGain();rainG.gain.value=0;
    loop(wb).connect(rf);rf.connect(rainG);rainG.connect(master);
    setDepth(depth,true);setWeather(wx);sched();
    document.addEventListener('visibilitychange',()=>{ctx&&(document.hidden?ctx.suspend():ctx.resume())});
  }
  function whoosh(){
    if(!ctx||ctx.state!=='running'||vol<=0)return;
    const t=ctx.currentTime,s=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();
    s.buffer=wb;bp.type='bandpass';bp.Q.value=1.2;
    bp.frequency.setValueAtTime(250,t);bp.frequency.exponentialRampToValueAtTime(1400,t+.25);bp.frequency.exponentialRampToValueAtTime(300,t+1);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
    s.connect(bp);bp.connect(g);g.connect(master);s.start(t,Math.random()*1.5);s.stop(t+1.2);
    const o=ctx.createOscillator(),og=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+.5);
    og.gain.setValueAtTime(.4,t);og.gain.exponentialRampToValueAtTime(.0001,t+.55);
    o.connect(og);og.connect(master);o.start(t);o.stop(t+.6);
  }
  return{start,setVolume,setDepth,setWeather,whoosh};
})();

/* ===================== 3D SCENE (Three.js) ===================== */
function createOcean(canvas){
  const R=Math.random,PI=Math.PI,DEEP=130,mobile=innerWidth<768;
  const FISH=mobile?18:34,SNOW=mobile?1300:2600;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:!mobile});
  renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,.1,600);
  scene.fog=new THREE.FogExp2(0x2bb7cf,.02);
  const amb=new THREE.AmbientLight(0x8fe8ff,.8),sunL=new THREE.DirectionalLight(0xdffcff,1.2);
  sunL.position.set(5,30,10);scene.add(amb,sunL);
  const C=x=>new THREE.Color(x);
  const WX={
    sunny:{stops:['#35c4dc','#0d84a6','#06406a','#031a30','#01080f'],skyA:'#2aa9c9',skyB:'#f4ffff',rayCol:'#d8fdff',amb:'#8fe8ff',sun:'#ffffff',ray:1,ambI:.8,sunI:1.2,light:1,glow:1,rain:0},
    sunrise:{stops:['#f2a58c','#c9697f','#4a3a78','#1c1b46','#05050f'],skyA:'#f08a7a',skyB:'#ffe2b8',rayCol:'#ffd2a8',amb:'#ffc3a8',sun:'#ffb98a',ray:.85,ambI:.65,sunI:1,light:.85,glow:1.1,rain:0},
    sunset:{stops:['#c9532f','#8f2f63','#3c2166','#150f36','#04030c'],skyA:'#c94a30',skyB:'#ffb37a',rayCol:'#ffb27a',amb:'#e8a0b8',sun:'#ff8f5a',ray:.9,ambI:.55,sunI:.9,light:.7,glow:1.3,rain:0},
    night:{stops:['#0d2a5c','#081a42','#050f2b','#030818','#010208'],skyA:'#0b1f4a',skyB:'#9fc4ff',rayCol:'#8fb4ff',amb:'#4a6aa8',sun:'#9fb8ff',ray:.35,ambI:.35,sunI:.35,light:.3,glow:2,rain:0},
    rain:{stops:['#4f7882','#3d6672','#1f3d4d','#0e202c','#03080c'],skyA:'#4b7480',skyB:'#b9d0d4',rayCol:'#b4cdd2',amb:'#8fb0b8',sun:'#cfe3e6',ray:.25,ambI:.5,sunI:.5,light:.55,glow:1.1,rain:1}
  };
  const CP=['skyA','skyB','rayCol','amb','sun'],NP=['ray','ambI','sunI','light','glow','rain'];
  Object.values(WX).forEach(w=>{w.c={stops:w.stops.map(C)};CP.forEach(p=>w.c[p]=C(w[p]))});
  const W0=WX.sunny,cur={stops:W0.stops.map(C)};
  CP.forEach(p=>cur[p]=C(W0[p]));NP.forEach(p=>cur[p]=W0[p]);
  let tgt=W0;
  function stepWeather(k){
    cur.stops.forEach((c,i)=>c.lerp(tgt.c.stops[i],k));
    CP.forEach(p=>cur[p].lerp(tgt.c[p],k));NP.forEach(p=>cur[p]+=(tgt[p]-cur[p])*k);
  }
  function setWeather(n,instant){tgt=WX[n]||tgt;if(instant)stepWeather(1);AUDIO.setWeather(n)}
  const stops=cur.stops;
  const zoneColor=(t,out)=>{const f=Math.min(.9999,t)*4,i=Math.floor(f);return out.copy(stops[i]).lerp(stops[i+1],f-i)};
  const U={uT:{value:0},uFog:{value:new THREE.Color()},uCam:{value:new THREE.Vector3()},uSkyA:{value:cur.skyA},uSkyB:{value:cur.skyB},uRain:{value:0},uLight:{value:1}};
  const CAUS='float caus(vec2 p,float t){vec2 i=p;float c=1.;float k=.005;for(int n=0;n<4;n++){float t2=t*(1.-3.5/float(n+1));i=p+vec2(cos(t2-i.x)+sin(t2+i.y),sin(t2-i.y)+cos(t2+i.x));c+=1./length(vec2(p.x/(sin(i.x+t2)/k),p.y/(cos(i.y+t2)/k)));}c/=4.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}';
  const VERT='varying vec3 w;void main(){w=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(w,1.);}';
  const HEAD='uniform float uT;uniform vec3 uFog;uniform vec3 uCam;uniform vec3 uSkyA;uniform vec3 uSkyB;uniform float uRain;uniform float uLight;varying vec3 w;'+CAUS;

  function sprite(ring){
    const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);
    if(ring){gr.addColorStop(0,'rgba(255,255,255,.05)');gr.addColorStop(.75,'rgba(255,255,255,.12)');gr.addColorStop(.9,'rgba(255,255,255,.85)');gr.addColorStop(1,'rgba(255,255,255,0)')}
    else{gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)')}
    g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
  }
  const addPoints=(arr,mat)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));scene.add(new THREE.Points(g,mat));return g};

  /* surface + seabed */
  const surf=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.ShaderMaterial({uniforms:U,transparent:true,side:THREE.DoubleSide,depthWrite:false,vertexShader:VERT,
    fragmentShader:HEAD+'void main(){float c=caus(w.xz*.06,uT*.4);float d=length(w-uCam);vec3 col=mix(uSkyA,uSkyB,c*1.4);col+=.12*sin(w.x*.3+uT)*sin(w.z*.3-uT*.8);col+=uSkyB*exp(-length(w.xz-vec2(18.,-55.))*.05)*.45;vec2 g=w.xz*.35;vec2 id=floor(g);float hh=fract(sin(dot(id,vec2(12.9,78.2)))*43758.5);float ph=fract(uT*.7+hh);float rr=length(fract(g)-.5+(vec2(fract(hh*7.),fract(hh*13.))-.5)*.3);col+=smoothstep(.05,0.,abs(rr-ph*.45))*(1.-ph)*uRain;gl_FragColor=vec4(mix(col,uFog,clamp(d*.006,0.,.5)),clamp(.9-d*.0035,0.,.9));}'}));
  surf.rotation.x=-PI/2;scene.add(surf);
  const gSea=new THREE.PlaneGeometry(400,400,90,90),pa=gSea.attributes.position;
  for(let i=0;i<pa.count;i++){const x=pa.getX(i),y=pa.getY(i);pa.setZ(i,Math.sin(x*.05)*3+Math.cos(y*.07)*3+Math.sin(x*.19+y*.13)*1.2)}
  const sea=new THREE.Mesh(gSea,new THREE.ShaderMaterial({uniforms:U,vertexShader:VERT,
    fragmentShader:HEAD+'void main(){float c=caus(w.xz*.05,uT*.35);float d=length(w-uCam);vec3 b=vec3(.74,.56,.33)*(.88+.12*sin(w.x*.6+sin(w.z*.35)*2.)+.06*sin(w.x*.1)*sin(w.z*.1))+vec3(.85,.65,.35)*min(c,1.2)*.22;b*=.8*uLight;gl_FragColor=vec4(mix(b,uFog,1.-exp(-d*d*.00022)),1.);}'}));
  sea.rotation.x=-PI/2;sea.position.y=-DEEP-6;scene.add(sea);
  const rocks=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),new THREE.MeshLambertMaterial({color:0x1d3a45,flatShading:true}),60),m4=new THREE.Matrix4(),q=new THREE.Quaternion(),eu=new THREE.Euler();
  for(let i=0;i<60;i++){const s=1.5+R()*5;eu.set(R()*3,R()*3,R()*3);q.setFromEuler(eu);m4.compose(new THREE.Vector3((R()-.5)*120,-DEEP-4,-8-R()*70),q,new THREE.Vector3(s,s*.7,s));rocks.setMatrixAt(i,m4)}
  scene.add(rocks);

  /* god rays */
  const rc=document.createElement('canvas');rc.width=64;rc.height=256;
  {const g=rc.getContext('2d'),v=g.createLinearGradient(0,0,0,256);v.addColorStop(0,'#fff');v.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=v;g.fillRect(0,0,64,256);
   const h=g.createLinearGradient(0,0,64,0);h.addColorStop(0,'#000');h.addColorStop(.5,'rgba(0,0,0,0)');h.addColorStop(1,'#000');g.globalCompositeOperation='destination-out';g.fillStyle=h;g.fillRect(0,0,64,256)}
  const rt=new THREE.CanvasTexture(rc),rays=[];
  for(let i=0;i<12;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(4+R()*8,140),new THREE.MeshBasicMaterial({map:rt,transparent:true,opacity:.2,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide,color:0xbff8ff}));
    m.position.set((R()-.5)*90,-62,-8-R()*50);m.rotation.z=.18+R()*.05;m.userData={b:.08+R()*.14,p:R()*6};scene.add(m);rays.push(m)}

  /* particles: marine snow + bubbles */
  const sp=new Float32Array(SNOW*3);
  for(let i=0;i<SNOW;i++){sp[i*3]=(R()-.5)*90;sp[i*3+1]=-R()*(DEEP+5);sp[i*3+2]=-R()*60+8}
  const snowG=addPoints(sp,new THREE.PointsMaterial({map:sprite(0),size:.45,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending,color:0xcff8ff}));
  const NB=260,bp=new Float32Array(NB*3),bv=[];
  for(let i=0;i<NB;i++){bp[i*3]=(R()-.5)*50;bp[i*3+1]=-R()*DEEP;bp[i*3+2]=-4-R()*35;bv.push(.03+R()*.07)}
  const bubG=addPoints(bp,new THREE.PointsMaterial({map:sprite(1),size:1.1,transparent:true,opacity:.9,depthWrite:false,color:0xe8ffff}));
  let bi=0;

  /* fish: low-poly body + tail, dorsal and pectoral fins, shader tail-wag, motion trails */
  const FU={value:0},tmp=new THREE.Vector3();
  function fishGeo(size){
    const parts=[];
    const add=(g,x,y,z,c,sx,sy,sz)=>{g=g.index?g.toNonIndexed():g;g.scale(sx,sy,sz);g.translate(x,y,z);parts.push([g,c])};
    add(new THREE.SphereGeometry(.5,7,5),0,0,0,1,1.25,.65,.42);
    const tail=new THREE.ConeGeometry(.3,.5,4);tail.rotateZ(-PI/2);add(tail,-.7,0,0,.7,1,1.4,.25);
    const dor=new THREE.ConeGeometry(.18,.4,3);dor.rotateZ(.4);add(dor,-.05,.28,0,.7,1,1,.25);
    [1,-1].forEach(s=>{const p=new THREE.ConeGeometry(.1,.4,3);p.rotateX(s*PI/2);add(p,.15,-.1,s*.18,.7,1,.3,1)});
    let n=0;parts.forEach(p=>n+=p[0].attributes.position.count);
    const pos=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;
    parts.forEach(([g,c])=>{const a=g.attributes.position.array;pos.set(a,o*3);for(let i=0;i<a.length/3;i++){col[(o+i)*3]=col[(o+i)*3+1]=col[(o+i)*3+2]=c}o+=a.length/3});
    const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(pos,3));G.setAttribute('color',new THREE.BufferAttribute(col,3));
    G.computeVertexNormals();G.scale(size,size,size);return G;
  }
  function fishState(S,f,t,P){
    const ph=f*.37,ang=t*(.35+S.k*.08)+ph*.06+Math.floor(f/10)*.25,rr=22+Math.sin(ph*3)*5;
    P.set(Math.cos(ang)*rr+Math.sin(t*2+ph)*.5,S.y+Math.sin(ph*2.3)*5+Math.sin(t+ph)*.6,-22+Math.sin(ang)*12*(1+Math.sin(ph)*.1));
    return -Math.atan2(Math.cos(ang)*12,-Math.sin(ang)*rr);
  }
  const schools=[[-12,0x9fe3ee,1],[-38,0xffb347,1.2],[-70,0x7fffe0,1.1]].map((S,k)=>{
    const mat=new THREE.MeshLambertMaterial({vertexColors:true,color:S[1]});
    mat.onBeforeCompile=sh=>{sh.uniforms.uTime=FU;sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>','vec3 transformed=vec3(position);float ph=instanceMatrix[3][0]*.7+instanceMatrix[3][2]*.5;float kk=smoothstep(.2,-1.,position.x);transformed.z+=sin(uTime*9.+ph+position.x*3.)*.22*kk;')};
    const im=new THREE.InstancedMesh(fishGeo(S[2]),mat,FISH);im.frustumCulled=false;scene.add(im);
    return{im,y:S[0],k};
  });
  const dm=new THREE.Object3D();
  /* occasional bubbles released by random fish; they rise slowly on their own */
  const FB=40,fbp=new Float32Array(FB*3),fbc=new Float32Array(FB*3),fbl=new Float32Array(FB),fbv=new Float32Array(FB),fbh=new Float32Array(FB);let fbi=0,fbt=0;
  const fbG=addPoints(fbp,new THREE.PointsMaterial({map:sprite(1),size:.4,vertexColors:true,transparent:true,opacity:.8,depthWrite:false,blending:THREE.AdditiveBlending}));
  fbG.setAttribute('color',new THREE.BufferAttribute(fbc,3));scene.children[scene.children.length-1].frustumCulled=false;

  /* jellyfish */
  const jellies=[0x5cffd6,0xff7ad9,0x9d8cff,0xffc16b,0x5cd7ff,0xff7ad9,0x5cffd6].map((col,k)=>{
    const g=new THREE.Group(),add=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false},o));
    const bell=new THREE.Mesh(new THREE.SphereGeometry(1.6,28,14,0,PI*2,0,PI/2),add(col,{opacity:.5,side:THREE.DoubleSide}));
    const core=new THREE.Mesh(new THREE.SphereGeometry(.8,16,8,0,PI*2,0,PI/2),add(0xffffff,{opacity:.45}));
    const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:sprite(0),color:col,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));glow.scale.set(9,9,1);
    g.add(bell,core,glow);const tn=[];
    for(let j=0;j<12;j++){const gm=new THREE.BufferGeometry().setFromPoints(Array.from({length:12},()=>new THREE.Vector3()));
      const ln=new THREE.Line(gm,new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.6,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(ln);tn.push({ln,a:j/12*PI*2})}
    g.scale.setScalar(.8+R()*1.1);g.position.set((k%2?1:-1)*(6+R()*14),-30-k*13-R()*6,-10-R()*16);scene.add(g);
    return{g,bell,tn,ph:R()*6,by:g.position.y,bx:g.position.x};
  });

  /* water dispersal: a click sends a shockwave that shoves nearby particles, fish and jellyfish outward; they drift/spring back */
  const sv=new Float32Array(SNOW*3),bw=new Float32Array(NB*3),RADIUS=30,rings=[],ringTex=sprite(1);
  schools.forEach(S=>{S.o=new Float32Array(FISH*3);S.v=new Float32Array(FISH*3)});
  jellies.forEach(J=>{J.o=new THREE.Vector3();J.v=new THREE.Vector3();J.g.userData.oz=0});
  function shove(arr,i,qx,qy,qz,p,str){
    let dx=qx-p.x,dy=qy-p.y,dz=qz-p.z;const d=Math.hypot(dx,dy,dz)||.01;
    if(d>=RADIUS)return;const f=Math.pow(1-d/RADIUS,2)*str/d;
    arr[i*3]+=dx*f;arr[i*3+1]+=dy*f;arr[i*3+2]+=dz*f;
  }
  function disperse(p){
    AUDIO.whoosh();if(mot<.05)return;
    const a=snowG.attributes.position,b=bubG.attributes.position;
    for(let i=0;i<SNOW;i++)shove(sv,i,a.getX(i),a.getY(i),a.getZ(i),p,14);

    h('div',{className:glass},
      h('div',{className:'text-[15px] font-bold text-glow'},first?'Before you dive in':'Settings'),
      h('h2',{className:'font-display text-[clamp(34px,5vw,48px)] font-extrabold leading-none text-ink'},first?'Ming Thong':'Motion & sound'),
      first&&h('p',{className:'mt-3 text-[17px] font-medium leading-relaxed text-dim'},'Set the motion and sound to whatever feels comfortable. You can change both later.'),
      h(Slider,{label:'Motion',hint:'Water, fish, jellyfish and parallax. 0% keeps everything still.',value:cfg.motion,onChange:v=>setCfg({...cfg,motion:v})}),
      h(Slider,{label:'Sound volume',hint:'Ambient water, bubbles and the click whoosh. 0% is silent.',value:cfg.volume,onChange:v=>setCfg({...cfg,volume:v}),onGrab:()=>AUDIO.start()}),
      h('button',{autoFocus:true,onClick:onDone,className:'mt-7 w-full rounded-full bg-ink px-6 py-3 text-[17px] font-bold text-inv transition hover:scale-[1.02]'},first?'Dive in':'Done')));
}
const loadCfg=()=>{
  let c={motion:matchMedia('(prefers-reduced-motion:reduce)').matches?.3:1,volume:.5};
  try{const s=JSON.parse(localStorage.getItem('dive-cfg'));if(s&&typeof s.motion==='number'&&typeof s.volume==='number')c=s}catch(e){}
  return c;
};
function App(){
  const ocean=useRef(null);
  useEffect(()=>{ocean.current=createOcean(document.getElementById('ocean'));return()=>ocean.current.dispose()},[]);
  const [weather,next]=useWeather(ocean);
  const [cfg,setCfg]=useState(loadCfg),[stage,setStage]=useState('intro'),[started,setStarted]=useState(false);
  useEffect(()=>{
    ocean.current&&ocean.current.setMotion(cfg.motion);AUDIO.setVolume(cfg.volume);
    document.documentElement.dataset.motion=cfg.motion<.05?'off':'on';
    try{localStorage.setItem('dive-cfg',JSON.stringify(cfg))}catch(e){}
  },[cfg]);
  useEffect(()=>{document.body.style.overflow=stage==='done'?'':'hidden'},[stage]);
  return h(React.Fragment,null,
    h(Chrome,{weather,onWeather:next,onSettings:()=>setStage('open')}),
    h('main',{className:'relative z-10'},h(Hero,{ready:started}),SECTIONS.slice(1).map(s=>h(Panel,{key:s.id,s}))),
    stage!=='done'&&h(Settings,{cfg,setCfg,first:!started,onDone:()=>{AUDIO.start();setStarted(true);setStage('done')}}),
    h('footer',{className:'relative z-10 px-5 pb-[calc(5rem+env(safe-area-inset-bottom,0px))] pt-8 text-center'},
      h('span',{className:`inline-block rounded-full px-4 py-1.5 text-[13px] font-semibold text-ink ${chip}`},'© 2026 Ming Thong · Built from scratch')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
