<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#031528;--ink:#effbff;--mut:#9fd0e2;--line:rgba(170,220,255,.28);--soft:rgba(255,255,255,.08);--pri:#7fe9ff;--on:#031528;--scrim:rgba(1,8,15,.94);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}body{background:linear-gradient(180deg,#0d84a6 0%,#06406a 22%,#031a30 55%,#01080f 100%) fixed}
body{font-family:'Baloo 2','Nunito',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:40px 24px 64px}
.eyebrow{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px}
h1{font-size:clamp(36px,7vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.02;margin:0 0 16px}
.lead{color:var(--mut);font-size:17px;line-height:1.55;max-width:560px;margin:0 0 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:28px 20px}
.card{text-align:left;display:block;width:100%;animation:up .5s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .2s}
.thumb{border:1px solid var(--line);aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--soft);position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .thumb img,.card:hover .thumb video,.card:focus-visible .thumb img{transform:scale(1.05)}
.card:focus-visible{outline:2px solid var(--pri);outline-offset:4px;border-radius:16px}
.card .t{font-weight:800;font-size:18px;margin:14px 0 2px}.card .s{color:var(--mut);font-size:14px}
.tag{position:absolute;left:12px;top:12px;background:rgba(3,21,40,.78);backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--ink);font-size:12px;font-weight:600;padding:5px 10px;border-radius:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:-8px 0 32px}.wm{font-size:15px;font-weight:800;text-decoration:none;color:var(--ink)}.wm b{color:var(--pri)}.pill{margin-left:auto;min-height:44px;padding:0 20px;border-radius:22px;border:1.5px solid var(--pri);color:var(--pri);font-weight:600;font-size:14px;display:inline-flex;align-items:center;text-decoration:none}.pill:active{transform:scale(.95)}.back{min-height:44px;padding:0 4px;font-weight:600;color:var(--pri);margin:-8px 0 24px;display:inline-flex;align-items:center;gap:6px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;padding:20px 0;margin:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta b{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.meta span{font-weight:600;font-size:15px}
.cols{display:grid;grid-template-columns:1fr;gap:32px}
@media(min-width:760px){.cols{grid-template-columns:1.6fr 1fr;gap:56px}}
.cols p{line-height:1.7;font-size:16px;margin:0 0 16px}
h2{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}.chip{padding:8px 14px;border-radius:20px;background:var(--soft);border:1px solid var(--line);backdrop-filter:blur(12px);font-weight:600;font-size:13px}
.link{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:22px;background:var(--pri);color:var(--on);font-weight:600;font-size:14px;text-decoration:none}
.media{display:grid;gap:16px;margin-top:40px}
@media(min-width:760px){.media{grid-template-columns:1fr 1fr}.media .full{grid-column:1/-1}}
.m{border-radius:16px;overflow:hidden;background:var(--soft);position:relative;cursor:zoom-in;padding:0}
.m img,.m video{width:100%;display:block}.m video{cursor:default}
.cap{padding:10px 4px 0;color:var(--mut);font-size:13px}
.lb{position:fixed;inset:0;background:var(--scrim);z-index:10;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.x{position:absolute;top:calc(12px + env(safe-area-inset-top,0));right:16px;color:#fff;font-size:32px;min-width:44px;min-height:44px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.pill,.link,.back{transition:background .2s,color .2s,transform .2s}
.pill:hover{background:var(--pri);color:var(--on)}.link:hover,.back:hover{transform:scale(1.05)}
.rv{opacity:0;filter:blur(8px);transform:translateY(48px);transition:all 1s ease-out}.rv.on{opacity:1;filter:none;transform:none}
html[data-motion="off"],html[data-motion="off"] *{transition-duration:.01s!important;animation:none!important}
.gnav{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:5;display:flex;flex-direction:row;gap:2px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(3,21,40,.78);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:0 10px 30px -14px rgba(0,10,25,.45);transition:transform .3s}
.gnav.off{transform:translate(-50%,-160%)}
.gnav:focus-within{transform:translateX(-50%)}
.gnav a{display:flex;flex-direction:row;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;color:var(--mut);text-decoration:none;transition:background .2s,color .2s}
.gnav a:hover{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink)}
.gnav a[aria-current]{background:var(--ink);color:var(--on)}
.gnav a:focus-visible{outline:2px solid var(--pri);outline-offset:4px}
.gnav svg{width:16px;height:16px;flex:none}
.gnav span{font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.wrap{padding-top:80px}
@media(max-width:560px){.gnav a{padding:8px 11px}.gnav span{display:none}}
</style></head><body><nav class="gnav" aria-label="Primary"><a href="index.html#home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg><span>Home</span></a><a href="index.html#about" aria-label="About Me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 100-8 4 4 0 000 8z"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span>About Me</span></a><a href="#" aria-label="Portfolio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h7v7H4z"/><path d="M13 4h7v7h-7z"/><path d="M4 13h7v7H4z"/><path d="M13 13h7v7h-7z"/></svg><span>Portfolio</span></a><a href="index.html#skills" aria-label="Skills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Skills</span></a><a href="index.html#game" aria-label="Game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12a4 4 0 014 4v2a3 3 0 01-5.2 2L15 14H9l-1.8 2A3 3 0 012 14v-2a4 4 0 014-4z"/><path d="M7 11v3"/><path d="M5.5 12.5h3"/><path d="M16 12h.01"/><path d="M18 13.5h.01"/></svg><span>Game</span></a><a href="index.html#contact" aria-label="Contact"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="M3 7l9 6 9-6"/></svg><span>Contact</span></a></nav><div class="wrap" id="app"></div>
<script>
/* ============================================================
   EDIT HERE. Add / remove projects. Each project has:
   id (no spaces), title, subtitle, cover (image/gif/video), details, media[]
   MEDIA TYPES:  {type:"image", src:"img/shot1.jpg", caption:"..."}
                 {type:"gif",   src:"img/demo.gif"}
                 {type:"video", src:"video/walkthrough.mp4", poster:"img/poster.jpg"}
   Add  full:true  to make an item span the full width.
   ============================================================ */
const ph=(c,t)=>"data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'><rect width='800' height='600' fill='${c}'/><text x='400' y='310' font-family='sans-serif' font-size='32' font-weight='700' fill='white' text-anchor='middle' opacity='.85'>${t}</text></svg>`);
const HOME_PAGE="index.html"; /* your core portfolio page */
const OWNER={name:"Your Name",intro:"Selected work. Tap a project to see the full story, process and media."};

const PROJECTS = [
  {
    id: "SingHealth Redesigned",
    title: "SingHealth Redesigned",
    subtitle: "Healthcare App UX/UI Redesign",
    tag: "App design",
    cover: { type: "image", src: "SingHealth/SingHealth%20Cover%20Page.png" },
    details: {

    ],

    link: { label: "Open Report", href: "https://canva.link/3rpq1r1o7hokzt0" },
    media: [
      { type: "image", src: "SingHealth/SingHealth_1.png", caption: "", full: true },
      { type: "image", src: "SingHealth/SingHealth_2.png" },
      { type: "image", src: "SingHealth/SingHealth_3.png" },
      { type: "image", src: "SingHealth/SingHealth_4.png" },
      { type: "image", src: "SingHealth/SingHealth_5.png" },
      { type: "image", src: "SingHealth/SingHealth_6.png" },
      { type: "image", src: "SingHealth/SingHealth_7.png" }
    ]
  },
  {
    id: "JamsBud",
    title: "JamsBud",
    subtitle: "A social music platform for discovering communities, sharing playlists and connecting through collaborative Jam Rooms.",
    tag: "Mobile APP Design",
    cover: { type: "image", src: "JAMsBud/JamsBud_coverpage.png" },
    details: {
      Year: "2026",
      Role: "Project Manager & UXUI Designer",
      Client: "School Project"
    },
    summary: [
      "JamsBud is a social music platform that allows users to create and join collaborative Jam Rooms, discover music communities, share playlists and connect with others through a shared love of music. Led the project by establishing the initial UX/UI design direction and collaborating with another UX designer. Managed task delegation, provided design guidance, reviewed content and design deliverables, and ensured the platform's features and user experience aligned with the overall project vision."
    ],
    tools: [
      "FIGMA",
      "literature Review",
      "Market Research",

      "Remote Moderated Usability Test",

    ],
    media: [
      { type: "image", src: "JAMsBud/JamsBud_1.png", full: true },
      { type: "image", src: "JAMsBud/JamsBud_2.png" },
      { type: "image", src: "JAMsBud/JamsBud_3.png" },
      { type: "image", src: "JAMsBud/JamsBud_4.png" },
      { type: "image", src: "JAMsBud/JamsBud_5.png" },
    ]
  },
  {
    id: "GRID-GO",
    title: "GRID-GO",
    subtitle: "A unified EV charging platform for seamless discovery, reservations, and real-time charging management.",
    tag: "School Project",
    cover: { type: "image", src:"GRID-GO/Grid-Go%20Cover%20Page.png" },
    details: { Year: "2025", Role: "UXUI Designer" },
    summary: [
      "GRIDGO is a unified EV charging platform in Singapore that addresses the fragmented charging ecosystem, where drivers currently need to switch between multiple operators to locate, book, and use charging stations with unreliable real-time availability. GRIDGO allows users to seamlessly discover nearby chargers, reserve guaranteed time slots, authenticate via QR code, and monitor charging sessions—all within a single integrated app across all charging networks. By combining real-time availability verification with intelligent queue management, GRIDGO transforms a fragmented and unpredictable charging experience into a unified and reliable user journey."
    ],
    tools: [
      "Market Research",
      "User Research",
      "Literature Review",
      "Figma",
      "Competitive Analysis"
    ],
    link: {
      label: "Open Report",
      href: "https://canva.link/a58xmgy7qb2u68l"
    },
    media: [
      
      { type: "image", src: "GRID-GO/GRID_GO_8.png", full: true },
       { type: "image", src: "GRID-GO/GRID_GO_1.png" },
      { type: "image", src: "GRID-GO/GRID_GO_2.png" },
      { type: "image", src: "GRID-GO/GRID_GO_3.png"},
      { type: "image", src: "GRID-GO/GRID_GO_4.png"},
      { type: "image", src: "GRID-GO/GRID_GO_5.png"},
      { type: "image", src: "GRID-GO/GRID_GO_6.png"},
      { type: "image", src: "GRID-GO/GRID_GO_7.png"},
      
    ]
  }
];
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tag=(m,cls)=>m.type==="video"
 ?`<video ${cls?`class="${cls}" `:""}src="${esc(m.src)}" ${m.poster?`poster="${esc(m.poster)}" `:""}muted loop playsinline preload="metadata" ${cls==="cv"?"autoplay":"controls"}></video>`
 :`<img src="${esc(m.src)}" alt="${esc(m.caption||"")}" loading="lazy">`;
function home(){
 document.title="Portfolio";
 app.innerHTML=`<div class="top"><a class="pill" href="${HOME_PAGE}">← Back to Home</a></div><p class="eyebrow">Portfolio</p><h1>${esc(OWNER.name)}</h1><p class="lead">${esc(OWNER.intro)}</p>
 <div class="grid">${PROJECTS.map((p,i)=>`<button class="card" style="animation-delay:${i*70}ms" data-id="${esc(p.id)}"><div class="thumb">${tag(p.cover,"cv")}${p.tag?`<span class="tag">${esc(p.tag)}</span>`:""}</div><div class="t">${esc(p.title)}</div><div class="s">${esc(p.subtitle)}</div></button>`).join("")}</div>`;
 app.querySelectorAll(".card").forEach(b=>{b.onclick=()=>{location.hash=b.dataset.id};tilt(b)});
 reveal();
 window.scrollTo(0,0);
}
function detail(p){
 document.title=p.title+" · Portfolio";
 const d=Object.entries(p.details||{});
 app.innerHTML=`<div class="top"><button class="back" id="bk" style="margin:0">← All projects</button><a class="pill" href="${HOME_PAGE}">← Back to app</a></div>
 <p class="eyebrow">${esc(p.tag||"Project")}</p><h1>${esc(p.title)}</h1><p class="lead" style="margin-bottom:0">${esc(p.subtitle)}</p>
 ${d.length?`<div class="meta">${d.map(([k,v])=>`<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}</div>`:""}
 <div class="cols"><div>${(p.summary||[]).map(t=>`<p>${esc(t)}</p>`).join("")}</div>
 <div>${p.tools?.length?`<h2>Tools</h2><div class="chips">${p.tools.map(t=>`<span class="chip">${esc(t)}</span>`).join("")}</div>`:""}${p.link?`<a class="link" href="${esc(p.link.href)}">${esc(p.link.label)}</a>`:""}</div></div>
 <div class="media">${(p.media||[]).map(m=>`<figure style="margin:0" class="${m.full?"full":""}"><div class="m" ${m.type==="video"?"":'data-zoom="1"'}>${tag(m)}</div>${m.caption?`<figcaption class="cap">${esc(m.caption)}</figcaption>`:""}</figure>`).join("")}</div>`;
 document.getElementById("bk").onclick=()=>{location.hash=""};
 app.querySelectorAll("[data-zoom] img").forEach(im=>im.parentNode.onclick=()=>zoom(im.src));
 app.querySelectorAll(".meta,.cols,.media figure").forEach(e=>e.classList.add("rv"));reveal();
 window.scrollTo(0,0);
}
function zoom(src){
 const l=document.createElement("div");l.className="lb";l.innerHTML=`<button class="x" aria-label="Close">×</button><img src="${esc(src)}" alt="">`;
 const c=()=>{l.remove();document.removeEventListener("keydown",k)},k=e=>{if(e.key==="Escape")c()};
 l.onclick=c;document.addEventListener("keydown",k);document.body.appendChild(l);
}
/* same interactions as index.html: card tilt, scroll reveal, motion setting, press ripple */
function tilt(el){
 el.onmousemove=e=>{const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform=`perspective(600px) rotateX(${-y*14}deg) rotateY(${x*14}deg) scale(1.03)`};
 el.onmouseleave=()=>{el.style.transform=""};
}
function reveal(){
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");io.unobserve(e.target)}}),{threshold:.15});
 app.querySelectorAll(".rv").forEach(e=>io.observe(e));
}
try{const c=JSON.parse(localStorage.getItem("dive-cfg"));if(c&&c.motion<.05)document.documentElement.dataset.motion="off"}catch(e){}
(()=>{
  const TAP=.97,DUR=500;
  document.addEventListener('pointerdown',e=>{
    const el=e.target.closest('button,a[href]');
    if(!el||e.button>0||document.documentElement.dataset.motion==='off'||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    if(getComputedStyle(el).position==='static')el.style.position='relative';
    let box=el.querySelector(':scope>[data-ripples]');
    if(!box){box=document.createElement('span');box.setAttribute('data-ripples','');box.setAttribute('aria-hidden','true');box.style.cssText='position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none';el.appendChild(box)}
    const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,dot=document.createElement('span');
    dot.style.cssText=`position:absolute;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px;width:${d}px;height:${d}px;border-radius:50%;background:currentColor;pointer-events:none`;
    box.appendChild(dot);
    dot.animate([{transform:'scale(0)',opacity:.35},{transform:'scale(1)',opacity:0}],{duration:DUR,easing:'cubic-bezier(.3,.55,.4,1)'}).onfinish=()=>dot.remove();
    el._ripEnd=performance.now()+DUR;
    const down=el.animate([{scale:1},{scale:TAP}],{duration:100,easing:'ease-out',fill:'forwards'});
    const up=()=>{removeEventListener('pointerup',up);removeEventListener('pointercancel',up);down.cancel();el.animate([{scale:TAP},{scale:1}],{duration:160,easing:'ease-out'})};
    addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
  /* let the ripple finish, then run the button's action */
  document.addEventListener('click',e=>{
    const el=e.target.closest('button,a[href]');
    if(!el||el._replay||!el._ripEnd)return;
    const wait=el._ripEnd-performance.now();
    if(wait<=0)return;
    e.preventDefault();e.stopImmediatePropagation();
    if(el._pending)return;
    el._pending=true;
    setTimeout(()=>{el._pending=false;el._replay=true;el.click();el._replay=false},wait);
  },true);
})();
function route(){const id=decodeURIComponent(location.hash.slice(1)),p=PROJECTS.find(x=>x.id===id);p?detail(p):home()}
addEventListener("hashchange",route);route();
</script><script>
/* nav slides away while scrolling down, returns on scroll up, near the top edge, or when focused */
(()=>{const n=document.querySelector('.gnav');if(!n)return;let y=scrollY;
addEventListener('scroll',()=>{const d=scrollY-y;y=scrollY;if(scrollY<80||d<-6)n.classList.remove('off');else if(d>6)n.classList.add('off')},{passive:true});
addEventListener('mousemove',e=>{if(e.clientY<70)n.classList.remove('off')});})();
</script></body></html>
